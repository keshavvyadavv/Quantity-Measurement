server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "${FRONTEND_URL}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: security-service-auth
          uri: lb://SECURITY-SERVICE
          predicates:
            - Path=/auth/**,/oauth2/**,/login/oauth2/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: false

        - id: quantity-measurement-app
          uri: lb://QUANTITY-MEASUREMENT-APP
          predicates:
            - Path=/api/v1/quantities/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
