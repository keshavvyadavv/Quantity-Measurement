server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: security-service-public
          uri: ${SECURITY_SERVICE_URL}
          predicates:
            - Path=/auth/**, /oauth2/**, /login/oauth2/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: false

        - id: quantity-measurement-service
          uri: ${QUANTITY_SERVICE_URL}
          predicates:
            - Path=/api/v1/quantities/**
          filters:
            - name: JwtAuthenticationFilter
              args:
                secured: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
