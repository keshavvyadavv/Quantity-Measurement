# ===== Spring Boot Application =====
spring.application.name=quantity-measurement-app

# Database Configuration 
# On Render, use the "Internal Database URL" if using a Render DB, or an external URL.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Note: Modern Hibernate automatically detects the dialect; 
# if using MySQL 8+, the default is usually sufficient.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Use a variable for the secret to keep it out of source control
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# GitHub OAuth2
# These should definitely be Environment Variables for security
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
